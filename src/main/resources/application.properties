# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/honey_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# \u26a0\ufe0f CHANGE THIS TO YOUR MYSQL PASSWORD! \u26a0\ufe0f
# If you don't know your password, try: admin123, root, password, or leave blank
spring.datasource.password=Apsa1234!

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080

# ============================================
# NOTIFICATION SETTINGS
# ============================================
ntfy.url=https://ntfy.sh
ntfy.topic=honey-inventory-alerts

# ============================================
# CORS SETTINGS
# ============================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ============================================
# LOGGING
# ============================================
logging.level.com.teash.inventory=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n